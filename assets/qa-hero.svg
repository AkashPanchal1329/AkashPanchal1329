<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">Akash Panchal — Software QA Engineer</title>
  <desc id="desc">Premium dark software testing portfolio header with electric cyan highlights and a conceptual QA test console.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1423"/>
      <stop offset="100%" stop-color="#14162C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111F31"/>
      <stop offset="100%" stop-color="#101525"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#48607E" stroke-width=".8" opacity=".18"/>
    </pattern>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1440" height="480" rx="24" fill="url(#canvas)"/>
  <rect width="1440" height="480" rx="24" fill="url(#grid)" opacity=".45"/>
  <circle cx="1136" cy="150" r="320" fill="url(#glow)"/>
  <path d="M 0 2 H1440" stroke="url(#accent)" stroke-width="4"/>

  <!-- Decorative technical lines -->
  <g opacity=".42" stroke="#2DD4BF" fill="none" stroke-width="1.4">
    <path d="M 660 0 V46 L704 90 H760"/>
    <circle cx="760" cy="90" r="4" fill="#2DD4BF" stroke="none"/>
    <path d="M 145 480 V443 L182 405 H310"/>
    <circle cx="310" cy="405" r="3.5" fill="#2DD4BF" stroke="none"/>
    <path d="M 1397 455 V410 L1422 386"/>
  </g>

  <!-- Left editorial pane -->
  <rect x="76" y="59" width="11" height="11" rx="3" fill="#22D3EE"/>
  <text x="103" y="71" fill="#71EAF3" font-size="16" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="3">QUALITY ENGINEERING  /  PORTFOLIO</text>
  <text x="74" y="194" fill="#F3F7FF" font-size="88" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="-3">AKASH</text>
  <text x="74" y="289" fill="#F3F7FF" font-size="88" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="-3">PANCHAL</text>
  <rect x="77" y="309" width="592" height="4" rx="2" fill="url(#accent)"/>
  <text x="77" y="351" fill="#C8DAEC" font-size="25" font-family="DejaVu Sans, Arial, sans-serif" font-weight="500" letter-spacing=".5">SOFTWARE QA ENGINEER</text>
  <text x="77" y="385" fill="#92A7C0" font-size="18" font-family="DejaVu Sans, Arial, sans-serif">Manual Testing  /  API Automation  /  Web &amp; Mobile QA</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing=".9" font-size="13">
    <rect x="77" y="413" width="130" height="36" rx="9" fill="#0E2834" stroke="#246074"/>
    <text x="99" y="436" fill="#75E2EE">MANUAL QA</text>
    <rect x="218" y="413" width="147" height="36" rx="9" fill="#21213C" stroke="#514A84"/>
    <text x="241" y="436" fill="#C1B5FC">API TESTING</text>
    <rect x="376" y="413" width="156" height="36" rx="9" fill="#122C29" stroke="#2D7868"/>
    <text x="395" y="436" fill="#89E6C4">AUTOMATION</text>
  </g>

  <!-- Right concept QA console -->
  <rect x="831" y="57" width="545" height="370" rx="20" fill="#030711" opacity=".5" filter="url(#soft-glow)"/>
  <rect x="825" y="52" width="545" height="370" rx="19" fill="url(#pane)" stroke="#355168" stroke-width="1.3"/>
  <rect x="825" y="52" width="545" height="53" rx="19" fill="#172538"/>
  <rect x="825" y="86" width="545" height="20" fill="#172538"/>
  <path d="M 826 106 H1369" stroke="#31475D"/>
  <circle cx="854" cy="78" r="6" fill="#FB7185"/>
  <circle cx="876" cy="78" r="6" fill="#FBBF24"/>
  <circle cx="898" cy="78" r="6" fill="#34D399"/>
  <text x="926" y="85" fill="#B6C9D9" font-size="16" font-family="DejaVu Sans Mono, monospace">qa.console  /  strategy</text>
  <rect x="1260" y="69" width="82" height="23" rx="11" fill="#173A37" stroke="#2B7D71"/>
  <circle cx="1274" cy="80" r="4" fill="#5EEAD4"/>
  <text x="1286" y="85" fill="#78F1D9" font-size="12" font-family="DejaVu Sans Mono, monospace">QA MODE</text>

  <g font-family="DejaVu Sans Mono, monospace" font-size="19">
    <text x="857" y="149" fill="#7D96AE">01</text>
    <text x="909" y="149" fill="#8CE7F4">// define quality gates</text>
    <text x="857" y="192" fill="#7D96AE">02</text>
    <text x="909" y="192"><tspan fill="#B7A5FA">check</tspan><tspan fill="#D7E7F5">(</tspan><tspan fill="#A7F3D0">"API contracts"</tspan><tspan fill="#D7E7F5">);</tspan></text>
    <text x="857" y="231" fill="#7D96AE">03</text>
    <text x="909" y="231"><tspan fill="#B7A5FA">verify</tspan><tspan fill="#D7E7F5">(</tspan><tspan fill="#A7F3D0">"user flows"</tspan><tspan fill="#D7E7F5">);</tspan></text>
    <text x="857" y="270" fill="#7D96AE">04</text>
    <text x="909" y="270"><tspan fill="#B7A5FA">probe</tspan><tspan fill="#D7E7F5">(</tspan><tspan fill="#A7F3D0">"edge cases"</tspan><tspan fill="#D7E7F5">);</tspan></text>
    <text x="857" y="309" fill="#7D96AE">05</text>
    <text x="909" y="309"><tspan fill="#B7A5FA">report</tspan><tspan fill="#D7E7F5">(</tspan><tspan fill="#A7F3D0">"clear defects"</tspan><tspan fill="#D7E7F5">);</tspan></text>
  </g>
  <path d="M 854 334 H1341" stroke="#304154"/>
  <circle cx="864" cy="369" r="7" fill="#63E6BC"/>
  <path d="M 861 369 L864 372 L868 365" fill="none" stroke="#09231E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="883" y="375" fill="#C3D9E9" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600">Test beyond the happy path.</text>
  <text x="1341" y="400" text-anchor="end" fill="#7088A0" font-family="DejaVu Sans Mono, monospace" font-size="11">CONCEPTUAL QA WORKFLOW</text>

  <path d="M 22 478 H1418" stroke="url(#accent)" stroke-width="2" opacity=".5"/>
</svg>
